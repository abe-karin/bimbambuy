<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento BimBam Buy</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { background: #2c3e50; color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #3498db; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-message { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 0; }
        .chat-input { display: flex; padding: 15px; background: white; border-top: 1px solid #ddd; }
        .chat-input input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 1rem; }
        .chat-input button { background: #2c3e50; color: white; border: none; padding: 12px 20px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .chat-input button:hover { background: #1a252f; }
        .typing { font-style: italic; color: #888; font-size: 0.9rem; align-self: flex-start; display: none; margin-left: 10px;}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Assistente Virtual BimBam Buy
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message bot-message">Olá! Sou o assistente virtual da BimBam Buy. Como posso te ajudar hoje?</div>
    </div>
    <div class="typing" id="typing-indicator">O assistente está digitando...</div>
    
    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Digite sua dúvida aqui..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const typingIndicator = document.getElementById("typing-indicator");

    function addMessage(text, isUser) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message");
        msgDiv.classList.add(isUser ? "user-message" : "bot-message");
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Adiciona a mensagem do usuário na tela
        addMessage(text, true);
        userInput.value = "";
        
        // Mostra o indicador de digitação
        typingIndicator.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Envia para o backend em Flask
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensagem: text })
            });
            
            const data = await response.json();
            typingIndicator.style.display = "none";
            
            if (data.resposta) {
                addMessage(data.resposta, false);
            } else {
                addMessage("Desculpe, ocorreu um erro ao processar sua resposta.", false);
            }
        } catch (error) {
            typingIndicator.style.display = "none";
            addMessage("Erro de conexão com o servidor.", false);
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
